# This file is no longer used - dependencies are now installed directly in Dockerfile
# using conda/mamba and pip for better control and to avoid Julia conflicts

[workspace]
name = "sopa-baysor-benchmark"
version = "0.1.0"
description = "Benchmark environment for SOPA and Baysor spatial transcriptomics tools - NOW USING DOCKERFILE INSTEAD"
platforms = ["linux-64"]

# All dependencies moved to Dockerfile for better control
# Removed R/Seurat as they were not being used by the SOPA workflow

[tasks]
# Show available commands
help = """
    echo "Available commands:"
    echo "  sopa --help          - Run SOPA segmentation"
    echo "  baysor --help        - Run Baysor segmentation"
    echo "  pixi run test-all    - Test both tools"
    echo "  pixi run jupyter     - Start Jupyter Lab"
"""

# Run SOPA demo/test
test-sopa = """
    python -c "
import sopa
print('✓ SOPA imported successfully')
print(f'SOPA version: {sopa.__version__}')
"
"""

# Run Baysor test (Baysor from official Docker image)
test-baysor = """
    baysor --version
"""

# Run all tests
test-all = { depends-on = ["test-sopa", "test-baysor"] }

# Test all SOPA dependencies
test-dependencies = """
    python -c "
import sys
print('Testing SOPA dependencies...')

# Core SOPA
try:
    import sopa
    print('✓ SOPA core')
except ImportError as e:
    print('✗ SOPA core:', e)
    sys.exit(1)

# CellPose and related
backends = [
    ('cellpose', 'CellPose'),
    ('torch', 'PyTorch'),
    ('torchvision', 'TorchVision'),
    ('cv2', 'OpenCV'),
    ('spatialdata', 'SpatialData'),
    ('scanpy', 'ScanPy'),
    ('squidpy', 'SquidPy'),
    ('geopandas', 'GeoPandas'),
    ('anndata', 'AnnData'),
    ('zarr', 'Zarr'),
    ('numpy', 'NumPy'),
    ('pandas', 'Pandas'),
    ('scipy', 'SciPy'),
    ('matplotlib', 'Matplotlib'),
    ('seaborn', 'Seaborn'),
]

for module, name in backends:
    try:
        __import__(module)
        print(f'✓ {name}')
    except ImportError:
        print(f'⚠ {name} not available')

print('Dependency check complete!')
"
"""

# Start Jupyter Lab
jupyter = "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root"

# Example: Run SOPA segmentation
run-sopa-example = """
    python scripts/run_sopa.py --input /data/input --output /data/output
"""

# Example: Run Baysor segmentation
run-baysor-example = """
    baysor run \
        --config /workspace/configs/baysor_config.toml \
        -o /data/output/baysor \
        /data/input/transcripts.csv \
        :cell_id
"""

[feature.dev.dependencies]
pytest = ">=7.4"
black = ">=23.0"
ruff = ">=0.1"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }